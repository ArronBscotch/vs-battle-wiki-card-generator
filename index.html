<!DOCTYPE html>
<html>
	<head>
		<title>VS Battle Wiki Card Generator</title>
		<script src=" https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js "></script>
		<link rel="stylesheet" href="style/style.css">
	</head>
	<body>
		<div class="main-content">
			<div class="page-main">
				<div class="page-header">
					<div>VS Battle Wiki Card Generator</div>
				</div>
				<div class="link-input">
					<div style="display:flex; flex-direction: row; margin: 0px auto;">
						<div>Link:</div>
						<input type="text">
						<input type="button" value="generate">
					</div>
				</div>
				<div class="card-container">
					<div class="card-border" id="card-master">
						<div class="card-back">
							<div class="title-container">
								<div class="card-title">
									<span>Michael Newman (Click)</span>
								</div>
							</div>
							<div class="img-container">
								<div class="tier-tab">
									<span>10-B</span>
								</div>
								<img class="card-img" src="img/sandler.webp" alt="sandler">
							</div>
							<div class="text-container">
								<div class="attack-potency">
									<span>Attack Potency:</span>
									<span id="attack-field">Human Level</span>
								</div>
								<div class="speed">
									<span>Speed:</span>
									<span id="speed-field">Average Human</span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="script/main.js"></script>
	</body>
</html>
