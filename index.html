<!DOCTYPE html>
<html>
	<head>
		<title>VS Battle Wiki Card Generator</title>
		<link rel="stylesheet" href="style/style.css">
	</head>
	<body>
		<div class="main-content">
			<div class="page-main">
				<div class="page-header">
					<div>VS Battle Wiki Card Generator</div>
				</div>
				<div class="link-input">
					<div style="display:flex; flex-direction: row; margin: 0px auto;">
						<div>Link:</div>
						<input type="text">
						<input type="button" value="generate">
					</div>
				</div>
				<div class="card-container">
					<div class="card-border">
						<div class="card-back">
							<div class="title-container">
								<div class="card-title">
									<span>Michael Newman (Click)</span>
								</div>
							</div>
							<div class="img-container">
								<div class="tier-tab">
									<span>10-B</span>
								</div>
								<img class="card-img" src="img/sandler.webp" alt="sandler">
							</div>
							<div class="text-container">
								<div class="abilities-header">
									<span>Powers & Abilities</span>
								</div>
								<div class="abilities-list">
									<span>Reality Warping, Passive Time Travel and Immortality, Time Manipulation, Time Stop, Pocket Dimension, Information Manipulation, Light Manipulation, Sound Manipulation, Size Manipulation</span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
